name: Sync upstream

on:
  schedule:
    # GitHub Actions schedules use UTC; 14:00 UTC is 07:00 Pacific during daylight saving time.
    - cron: "0 14 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      UPSTREAM_REPOSITORY: microsoft/winget-pkgs
      SYNC_BRANCH: sync-upstream
    steps:
      - name: Check out the default branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Fetch upstream
        run: |
          git remote add upstream "https://github.com/${UPSTREAM_REPOSITORY}.git"
          git fetch upstream "+refs/heads/${DEFAULT_BRANCH}:refs/remotes/upstream/${DEFAULT_BRANCH}"

      - name: Fast-forward the default branch
        id: fast_forward
        run: |
          if git merge-base --is-ancestor "origin/${DEFAULT_BRANCH}" "upstream/${DEFAULT_BRANCH}"; then
            git merge --ff-only "upstream/${DEFAULT_BRANCH}"
            git push origin "HEAD:${DEFAULT_BRANCH}"
            echo "diverged=false" >> "$GITHUB_OUTPUT"
          else
            echo "diverged=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create a synchronization pull request
        if: steps.fast_forward.outputs.diverged == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --create "${SYNC_BRANCH}" "origin/${DEFAULT_BRANCH}"
          git merge --no-ff "upstream/${DEFAULT_BRANCH}" --message "Sync upstream ${DEFAULT_BRANCH}"
          git push --force-with-lease origin "${SYNC_BRANCH}"

          if gh pr list --head "${SYNC_BRANCH}" --base "${DEFAULT_BRANCH}" --state open --json number --jq 'length > 0' | grep -qx true; then
            exit 0
          fi

          gh pr create \
            --base "${DEFAULT_BRANCH}" \
            --head "${SYNC_BRANCH}" \
            --title "Sync upstream ${DEFAULT_BRANCH}" \
            --body "Synchronize this fork with ${UPSTREAM_REPOSITORY}@upstream/${DEFAULT_BRANCH}."
